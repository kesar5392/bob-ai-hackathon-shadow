submission:
  title: "Supply Chain Sentinel"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Global supply chain networks face frequent disruptions, opaque inventory tracking, and unexpected delay risks. Logistics managers and supply chain operators struggle to proactively predict and mitigate bottleneck risks before they impact downstream operations.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    Supply Chain Sentinel is an AI-powered monitoring and analytics platform that provides end-to-end visibility across logistics workflows. It leverages predictive intelligence to identify potential supply chain bottlenecks, flag operational risks, and automate real-time status reporting.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Real-time supply chain risk and anomaly detection"
    - "Predictive delay analysis and route bottleneck forecasting"
    - "Automated inventory tracking and status reporting dashboard"
    - "Interactive decision-support system for logistics operators"

  tech_stack:
    languages: ["Python", "JavaScript"]                       # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["watsonx.ai", "IBM Cloud"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["PostgreSQL"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["Docker", "GitHub Actions"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    We are most proud of integrating AI-driven predictive insights into a clean, actionable dashboard that enables logistics operators to move from reactive troubleshooting to proactive risk mitigation.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Due to hackathon time constraints, real-time external API integration with live carrier telemetry is simulated, and automated rerouting suggestions currently rely on pre-configured rule models.

